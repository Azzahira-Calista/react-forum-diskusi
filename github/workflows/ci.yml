name: Continuous Integration

on:
  pull_request:
    branches: [main]

jobs:
  automation-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and run tests
        run: |
          npm install
          npm run ci:test
